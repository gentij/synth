name: Check synth

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev \
            libxcb-icccm4-dev libxcursor-dev libxrandr-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev libwayland-dev \
            libfontconfig1-dev libfreetype-dev
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --release --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable test --release --workspace --locked
      - run: cargo +stable build --release --locked --bin platform-probe-standalone
      - run: cargo +stable install cargo-truce --version 6.3.0 --locked
      - run: cargo +stable truce build --vst3 -p platform-probe --target-cpu baseline
